    - data:
        code: "import json\nfrom datetime import datetime\n\n\n# ============================================================\n\
          # 1. Schema 常量\n# ============================================================\nCOMPLAINT_COLS = [\n    \"case_id\"\
          , \"received_at\", \"channel\", \"customer_id\", \"service_id\",\n    \"service_type\", \"region\", \"complaint_text\"\
          ,\n]\nSNAPSHOT_COLS = [\n    \"service_id\", \"customer_id\", \"service_type\", \"region\", \"snapshot_at\",\n \
          \   \"account_status\", \"bill_cycle\", \"contract_monthly_fee_yuan\",\n    \"charged_monthly_fee_yuan\", \"network_incident_status\"\
          ,\n    \"access_line_status\", \"install_order_id\", \"install_order_status\",\n    \"planned_complete_at\", \"\
          evidence_id\",\n]\nRULE_COLS = [\n    \"rule_id\", \"intent_code\", \"service_type\", \"verification_result\",\n\
          \    \"required_fields\", \"queue_id\", \"precedence\",\n    \"priority_normal\", \"priority_vip\", \"priority_enterprise\"\
          ,\n    \"sla_hours_normal\", \"sla_hours_vip\", \"sla_hours_enterprise\",\n    \"ticket_action\",\n]\nTICKET_COLS\
          \ = [\n    \"ticket_id\", \"customer_id\", \"service_id\", \"intent_code\",\n    \"status\", \"created_at\", \"\
          last_updated_at\", \"owner_queue\",\n]\nCUSTOMER_COLS = [\n    \"customer_id\", \"customer_name\", \"customer_level\"\
          , \"source_row_index\",\n]\n\nTABLE_SCHEMA = {\n    \"complaints\": (\"01 待处理新诉求\", COMPLAINT_COLS, \"case_id\"\
          ),\n    \"snapshots\":  (\"02 业务核验快照\", SNAPSHOT_COLS,  \"service_id\"),\n    \"rules\":      (\"03 分流与时限规则\", RULE_COLS,\
          \   \"rule_id\"),\n    \"tickets\":    (\"04 在途与历史工单\", TICKET_COLS, \"ticket_id\"),\n    \"customers\":  (\"05\
          \ 客户主档\",     CUSTOMER_COLS, \"customer_id\"),\n}\n\nFIELD_TYPES = {\n    \"complaints\": {\n        \"case_id\"\
          : \"text\", \"received_at\": \"datetime\", \"channel\": \"text\",\n        \"customer_id\": \"text\", \"service_id\"\
          : \"text\",\n        \"service_type\": \"enum\", \"region\": \"text\", \"complaint_text\": \"text\",\n    },\n \
          \   \"snapshots\": {\n        \"service_id\": \"text\", \"customer_id\": \"text\", \"service_type\": \"enum\",\n\
          \        \"region\": \"text\", \"snapshot_at\": \"datetime\", \"account_status\": \"text\",\n        \"bill_cycle\"\
          : \"text\",\n        \"contract_monthly_fee_yuan\": \"number\",\n        \"charged_monthly_fee_yuan\": \"number\"\
          ,\n        \"network_incident_status\": \"text\", \"access_line_status\": \"text\",\n        \"install_order_id\"\
          : \"text\", \"install_order_status\": \"text\",\n        \"planned_complete_at\": \"datetime\", \"evidence_id\"\
          : \"text\",\n    },\n    \"rules\": {\n        \"rule_id\": \"text\", \"intent_code\": \"text\", \"service_type\"\
          : \"enum\",\n        \"verification_result\": \"text\", \"required_fields\": \"text\",\n        \"queue_id\": \"\
          text\", \"precedence\": \"int\",\n        \"priority_normal\": \"text\", \"priority_vip\": \"text\",\n        \"\
          priority_enterprise\": \"text\",\n        \"sla_hours_normal\": \"int\", \"sla_hours_vip\": \"int\",\n        \"\
          sla_hours_enterprise\": \"int\", \"ticket_action\": \"text\",\n    },\n    \"tickets\": {\n        \"ticket_id\"\
          : \"text\", \"customer_id\": \"text\", \"service_id\": \"text\",\n        \"intent_code\": \"text\", \"status\"\
          : \"enum\",\n        \"created_at\": \"datetime\", \"last_updated_at\": \"datetime\",\n        \"owner_queue\":\
          \ \"text\",\n    },\n    \"customers\": {\n        \"customer_id\": \"text\", \"customer_name\": \"text\",\n   \
          \     \"customer_level\": \"enum\", \"source_row_index\": \"int\",\n    },\n}\n\nENUMS = {\n    (\"complaints\"\
          , \"service_type\"): {\"MOBILE\", \"BROADBAND\"},\n    (\"snapshots\",  \"service_type\"): {\"MOBILE\", \"BROADBAND\"\
          },\n    (\"rules\",      \"service_type\"): {\"MOBILE\", \"BROADBAND\", \"ANY\"},\n    (\"rules\",      \"verification_result\"\
          ):\n        {\"CONFIRMED\", \"NOT_CONFIRMED\", \"UNKNOWN\", \"NOT_CHECKED\", \"NOT_REQUIRED\"},\n    (\"rules\"\
          ,      \"ticket_action\"):\n        {\"CREATE_OR_MERGE\", \"MANUAL_REVIEW\", \"NO_TICKET\"},\n    (\"tickets\",\
          \    \"status\"): {\"OPEN\", \"IN_PROGRESS\", \"CLOSED\"},\n    (\"customers\",  \"customer_level\"): {\"普通客户\"\
          , \"VIP客户\", \"企业客户\"},\n}\n\n\n# ============================================================\n# 2. 表格解析 / 类型转换\
          \ / 单表校验\n# ============================================================\ndef _split_rows(text: str):\n    if not\
          \ text or not text.strip():\n        return [], []\n    lines = [ln.rstrip(\"\\r\") for ln in text.split(\"\\n\"\
          )]\n    lines = [ln for ln in lines if ln.strip() != \"\"]\n    if not lines:\n        return [], []\n    first\
          \ = lines[0]\n    use_pipe = first.lstrip().startswith(\"|\") or (\"\\t\" not in first and \"|\" in first)\n\n \
          \   def split_line(s: str):\n        if use_pipe:\n            s = s.strip()\n            if s.startswith(\"|\"\
          ):\n                s = s[1:]\n            if s.endswith(\"|\"):\n                s = s[:-1]\n            return\
          \ [c.strip() for c in s.split(\"|\")]\n        return [c.strip() for c in s.split(\"\\t\")]\n\n    header = split_line(lines[0])\n\
          \    rows = []\n    for ln in lines[1:]:\n        cells = split_line(ln)\n        if cells and all(c and set(c)\
          \ <= set(\"-: \") for c in cells):\n            if set(\"\".join(cells)) <= set(\"-: \"):\n                continue\n\
          \        rows.append(cells)\n    return header, rows\n\n\ndef _coerce(value: str, ftype: str):\n    s = (value or\
          \ \"\").strip()\n    if ftype in (\"text\", \"enum\"):\n        return s, True, s\n    if ftype == \"datetime\"\
          :\n        if s == \"\":\n            return \"\", True, s\n        try:\n            return datetime.fromisoformat(s).isoformat(),\
          \ True, s\n        except Exception:\n            return s, False, s\n    if ftype == \"number\":\n        if s\
          \ == \"\" or s.upper() == \"UNKNOWN\":\n            return s, True, s\n        try:\n            return float(s),\
          \ True, s\n        except Exception:\n            return s, False, s\n    if ftype == \"int\":\n        if s ==\
          \ \"\":\n            return \"\", True, s\n        try:\n            return int(s), True, s\n        except Exception:\n\
          \            return s, False, s\n    return s, True, s\n\n\ndef _parse_one_table(table_name: str, raw_text: str)\
          \ -> dict:\n    cn_name, required_cols, pk = TABLE_SCHEMA[table_name]\n    out = {\"table\": table_name, \"cn_name\"\
          : cn_name, \"header\": [], \"rows\": [],\n           \"parse_ok\": True, \"batch_issues\": [], \"row_issues\": []}\n\
          \n    header, raw_rows = _split_rows(raw_text)\n    if not header:\n        out[\"parse_ok\"] = False\n        out[\"\
          batch_issues\"].append(f\"{cn_name}：输入为空或无法识别表头\")\n        return out\n\n    missing = [c for c in required_cols\
          \ if c not in header]\n    if missing:\n        out[\"parse_ok\"] = False\n        out[\"batch_issues\"].append(f\"\
          {cn_name}：缺少必要列 {missing}\")\n        out[\"header\"] = header\n        return out\n\n    out[\"header\"] = header\n\
          \    col_idx = {c: header.index(c) for c in required_cols}\n    header_len = len(header)\n    pk_seen = {}\n\n \
          \   for i, cells in enumerate(raw_rows, start=2):\n        if len(cells) < header_len:\n            cells = cells\
          \ + [\"\"] * (header_len - len(cells))\n            out[\"row_issues\"].append({\"table\": table_name, \"row\":\
          \ i,\n                                      \"issue\": f\"列数不足（{len(cells)}<{header_len}），已补空\"})\n        elif\
          \ len(cells) > header_len:\n            cells = cells[:header_len]\n            out[\"row_issues\"].append({\"table\"\
          : table_name, \"row\": i,\n                                      \"issue\": f\"列数过多（>{header_len}），已截断\"})\n\n \
          \       rec = {}\n        for c in required_cols:\n            raw = cells[col_idx[c]]\n            val, ok, raw_val\
          \ = _coerce(raw, FIELD_TYPES[table_name][c])\n            rec[c] = val\n            if not ok:\n               \
          \ out[\"row_issues\"].append({\"table\": table_name, \"row\": i, \"col\": c,\n                                 \
          \         \"issue\": f\"类型无法解析为 {FIELD_TYPES[table_name][c]}\",\n                                          \"raw\"\
          : raw_val})\n\n        for c in required_cols:\n            ekey = (table_name, c)\n            if ekey in ENUMS\
          \ and rec[c] != \"\" and rec[c] not in ENUMS[ekey]:\n                out[\"row_issues\"].append({\"table\": table_name,\
          \ \"row\": i, \"col\": c,\n                                          \"issue\": \"枚举值不在允许集合\",\n               \
          \                           \"raw\": rec[c], \"allowed\": sorted(ENUMS[ekey])})\n\n        pk_val = rec.get(pk,\
          \ \"\")\n        if pk_val == \"\":\n            out[\"row_issues\"].append({\"table\": table_name, \"row\": i,\n\
          \                                      \"issue\": f\"主键 {pk} 为空\"})\n        elif pk_val in pk_seen:\n         \
          \   out[\"row_issues\"].append({\"table\": table_name, \"row\": i,\n                                      \"issue\"\
          : f\"主键 {pk} 重复（首次出现在第 {pk_seen[pk_val]} 行）\",\n                                      \"raw\": pk_val})\n      \
          \  else:\n            pk_seen[pk_val] = i\n\n        out[\"rows\"].append(rec)\n\n    return out\n\n\n# ============================================================\n\
          # 3. 索引构建 + 主流程\n# ============================================================\ndef _build_indexes(tables: dict)\
          \ -> dict:\n    snap_by_service, dup_snaps = {}, {}\n    for r in tables[\"snapshots\"][\"rows\"]:\n        sid\
          \ = r.get(\"service_id\", \"\")\n        if not sid:\n            continue\n        if sid in snap_by_service:\n\
          \            dup_snaps.setdefault(sid, [snap_by_service[sid]]).append(r)\n        else:\n            snap_by_service[sid]\
          \ = r\n\n    customer_by_id = {}\n    for r in tables[\"customers\"][\"rows\"]:\n        cid = r.get(\"customer_id\"\
          , \"\")\n        if cid:\n            customer_by_id.setdefault(cid, r)\n\n    rules_by_key = {}\n    for r in tables[\"\
          rules\"][\"rows\"]:\n        k = (r.get(\"intent_code\", \"\"), r.get(\"service_type\", \"\"),\n             r.get(\"\
          verification_result\", \"\"))\n        rules_by_key.setdefault(k, []).append(r)\n\n    tickets_by_key = {}\n   \
          \ for r in tables[\"tickets\"][\"rows\"]:\n        if r.get(\"status\", \"\") not in {\"OPEN\", \"IN_PROGRESS\"\
          }:\n            continue\n        k = (r.get(\"customer_id\", \"\"), r.get(\"service_id\", \"\"),\n            \
          \ r.get(\"intent_code\", \"\"))\n        tickets_by_key.setdefault(k, []).append(r)\n\n    return {\n        \"\
          snapshot_by_service\": snap_by_service,\n        \"duplicate_snapshot_services\": dup_snaps,\n        \"customer_by_id\"\
          : customer_by_id,\n        \"rules_by_key\": rules_by_key,\n        \"open_tickets_by_key\": tickets_by_key,\n \
          \   }\n\n\ndef parse_and_validate_inputs(str_01, str_02, str_03, str_04, str_05) -> dict:\n    raw_map = {\n   \
          \     \"complaints\": str_01 or \"\",\n        \"snapshots\":  str_02 or \"\",\n        \"rules\":      str_03 or\
          \ \"\",\n        \"tickets\":    str_04 or \"\",\n        \"customers\":  str_05 or \"\",\n    }\n    tables, batch_issues,\
          \ row_issues = {}, [], []\n    for name, text in raw_map.items():\n        parsed = _parse_one_table(name, text)\n\
          \        tables[name] = {\"header\": parsed[\"header\"], \"rows\": parsed[\"rows\"]}\n        batch_issues.extend(parsed[\"\
          batch_issues\"])\n        row_issues.extend(parsed[\"row_issues\"])\n\n    parse_ok = not batch_issues\n    indexes\
          \ = _build_indexes(tables)\n\n    summary = {\n        \"complaints\": len(tables[\"complaints\"][\"rows\"]),\n\
          \        \"snapshots\":  len(tables[\"snapshots\"][\"rows\"]),\n        \"rules\":      len(tables[\"rules\"][\"\
          rows\"]),\n        \"tickets\":    len(tables[\"tickets\"][\"rows\"]),\n        \"customers\":  len(tables[\"customers\"\
          ][\"rows\"]),\n        \"batch_issue_count\": len(batch_issues),\n        \"row_issue_count\":   len(row_issues),\n\
          \        \"duplicate_snapshot_service_ids\":\n            sorted(indexes[\"duplicate_snapshot_services\"].keys()),\n\
          \    }\n\n    return {\n        \"parse_ok\": parse_ok,\n        \"batch_issues\": batch_issues,\n        \"row_issues\"\
          : row_issues,\n        \"summary\": summary,\n        \"tables\": tables,\n        \"indexes\": {\n            \"\
          snapshot_by_service\": indexes[\"snapshot_by_service\"],\n            \"duplicate_snapshot_services\": indexes[\"\
          duplicate_snapshot_services\"],\n            \"customer_by_id\": indexes[\"customer_by_id\"],\n            \"rules_by_key\"\
          : {\"||\".join(k): v for k, v in indexes[\"rules_by_key\"].items()},\n            \"open_tickets_by_key\": {\"||\"\
          .join(k): v for k, v in indexes[\"open_tickets_by_key\"].items()},\n        },\n    }\n\n\n# ============================================================\n\
          # 4. Dify 代码节点入口（防御式，新增 complaints_list）\n# ============================================================\ndef main(str_01:\
          \ str, str_02: str, str_03: str, str_04: str, str_05: str) -> dict:\n    try:\n        res = parse_and_validate_inputs(str_01,\
          \ str_02, str_03, str_04, str_05)\n        parse_ok_val = \"true\" if res.get(\"parse_ok\") else \"false\"\n   \
          \     summary_val  = json.dumps(res.get(\"summary\", {}),      ensure_ascii=False, default=str)\n        batch_val\
          \    = json.dumps(res.get(\"batch_issues\", []), ensure_ascii=False, default=str)\n        row_val      = json.dumps(res.get(\"\
          row_issues\", []),   ensure_ascii=False, default=str)\n        tables_val   = json.dumps(res.get(\"tables\", {}),\
          \       ensure_ascii=False, default=str)\n        indexes_val  = json.dumps(res.get(\"indexes\", {}),      ensure_ascii=False,\
          \ default=str)\n\n        # 原生列表，供迭代节点使用，绝不能 json.dumps\n        complaints_list = res.get(\"tables\", {}).get(\"\
          complaints\", {}).get(\"rows\", [])\n        if not isinstance(complaints_list, list):\n            complaints_list\
          \ = []\n\n    except Exception as e:\n        parse_ok_val = \"false\"\n        summary_val  = json.dumps({\"error\"\
          : str(e)}, ensure_ascii=False)\n        batch_val    = json.dumps([f\"代码异常：{e}\"], ensure_ascii=False)\n       \
          \ row_val      = \"[]\"\n        tables_val   = \"{}\"\n        indexes_val  = \"{}\"\n        complaints_list =\
          \ []\n\n    return {\n        \"parse_ok\":          str(parse_ok_val),\n        \"summary_json\":      str(summary_val),\n\
          \        \"batch_issues_json\": str(batch_val),\n        \"row_issues_json\":   str(row_val),\n        \"tables_json\"\
          :       str(tables_val),\n        \"indexes_json\":      str(indexes_val),\n        \"complaints_list\":   complaints_list,\
          \   # \U0001F448 Array[Object]\n    }"
