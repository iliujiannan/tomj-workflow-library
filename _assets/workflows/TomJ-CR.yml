          {{ detail_table_text }}


          {% if manual_review_text %}

          ## 四、转人工复核清单


          {{ manual_review_text }}

          {% endif %}


          {% if no_ticket_text %}

          ## 五、不建单清单（NO_TICKET）


          {{ no_ticket_text }}

          {% endif %}


          ## 附：说明


          - 本报告仅汇总分流结果，不重新判定意图、业务状态或分流规则。

          - CREATE 为工单草稿，MERGE 为合并至已存在在途工单，MANUAL_REVIEW 为转人工复核，NO_TICKET 为非投诉不生成工单。

          - 所有工单编号均为草稿或在途引用，本报告不实际创建或派发工单。


