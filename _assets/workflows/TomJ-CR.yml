          \    v_fail_reason = \"快照归属不一致\"\n            elif snap.get(\"account_status\") != \"ACTIVE\":\n               \
          \ v_fail_reason = \"账户非 ACTIVE\"\n\n        if v_fail_reason:\n            result.update({\n                \"verification_result\"\
