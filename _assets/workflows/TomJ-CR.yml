          | 动作 | 数量 |

          | --- | --- |

          | CREATE（新建草稿） | {{ create_count }} |

          | MERGE（合并至在途） | {{ merge_count }} |

          | MANUAL_REVIEW（转人工） | {{ manual_count }} |

          | NO_TICKET（不建单） | {{ no_ticket_count }} |


          ## 三、逐条分流明细


          | 序号 | case_id | 客户 | 业务号码 | 主意图 | 核验 | 规则 | 队列 | 优先级 | SLA截止 | 动作 | 工单编号 | 说明 |

