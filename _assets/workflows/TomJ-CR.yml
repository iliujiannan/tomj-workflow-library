    - data:
        code: "import json\n\ndef main(summary_json: str, chart1_text: str, chart2_text: str) -> dict:\n    context = json.loads(summary_json)\n\
          \    results = context.get(\"results\", [])\n    actions = context.get(\"actions\", {})\n    \n    manual_reviews\
          \ = []\n    no_tickets = []\n    table_rows = []\n\n    def safe_val(v):\n        return \"-\" if v is None or v\
          \ == \"\" else str(v)\n\n    def format_reason(r_dict):\n        base = r_dict.get(\"reason\", \"\")\n        secs\
          \ = r_dict.get(\"secondary_intents\", [])\n        rel_tks = r_dict.get(\"related_ticket_ids\", [])\n        extras\
          \ = []\n        if secs and \"副意图\" not in base: extras.append(f\"副意图:{','.join(secs)}\")\n        if rel_tks and\
          \ \"关联工单\" not in base: extras.append(f\"关联工单:{','.join(rel_tks)}\")\n        if extras: base = base + \"；\" + \"\
          ；\".join(extras)\n        base = base.replace(\"|\", \"／\").replace(\"\\n\", \" \").replace(\"\\r\", \"\")\n   \
          \     if len(base) > 60: base = base[:60] + \"…\"\n        return base\n\n    def get_ticket_no(r_dict):\n     \
          \   action = r_dict.get(\"ticket_action\", \"\")\n        if action == \"CREATE\": return r_dict.get(\"draft_ticket_id\"\
          ) or f\"DRAFT-{r_dict.get('case_id')}\"\n        elif action == \"MERGE\": return r_dict.get(\"existing_ticket_id\"\
          ) or \"-\"\n        return \"-\"\n\n    for idx, r in enumerate(results, start=1):\n        case_id = r.get(\"case_id\"\
          , \"\")\n        action = r.get(\"ticket_action\", \"\")\n        \n        if action == \"MANUAL_REVIEW\":\n  \
          \          manual_reviews.append(f\"- {case_id}：{format_reason(r)}\")\n        elif action == \"NO_TICKET\":\n \
          \           no_tickets.append(f\"- {case_id}：{format_reason(r)}\")\n\n        row = [\n            str(idx), safe_val(case_id),\
          \ safe_val(r.get(\"customer_id\")),\n            safe_val(r.get(\"service_id\")), safe_val(r.get(\"primary_intent\"\
          )),\n            safe_val(r.get(\"verification_result\")), safe_val(r.get(\"matched_rule_id\")),\n            safe_val(r.get(\"\
          queue_id\")), safe_val(r.get(\"priority\")),\n            safe_val(r.get(\"sla_deadline\")), safe_val(action),\n\
          \            safe_val(get_ticket_no(r)), format_reason(r)\n        ]\n        table_rows.append(\"| \" + \" | \"\
          .join(row) + \" |\")\n\n    # 提取图表链接（兼容反引号）\n    def extract_url(text):\n        if not text: return \"\"\n    \
          \    text = text.strip()\n        if text.startswith(\"http\"): return text\n        return text\n\n    return {\n\
          \        \"create_count\": str(actions.get('CREATE', 0)),\n        \"merge_count\": str(actions.get('MERGE', 0)),\n\
          \        \"manual_count\": str(actions.get('MANUAL_REVIEW', 0)),\n        \"no_ticket_count\": str(actions.get('NO_TICKET',\
          \ 0)),\n        \"detail_table_text\": \"\\n\".join(table_rows),\n        \"manual_review_text\": \"\\n\".join(manual_reviews),\n\
          \        \"no_ticket_text\": \"\\n\".join(no_tickets),\n        \"chart1_url\": extract_url(chart1_text),\n    \
          \    \"chart2_url\": extract_url(chart2_text)\n    }"
