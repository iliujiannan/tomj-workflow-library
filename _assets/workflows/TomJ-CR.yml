    - data:
        code: "import json\nimport re\nfrom datetime import datetime, timedelta\n\n# ============================================================\n\
          # 1. 超级 JSON 提取器（无视 <think> 标签和 markdown）\n# ============================================================\ndef _extract_json(text:\
          \ str) -> dict:\n    if not text: return {}\n    # 清除 markdown 代码块标记\n    text = re.sub(r\"```(?:json)?\", \"\"\
          , text, flags=re.I).strip()\n    \n    # 优先定位标志位，精准截取大模型的 JSON\n    start_idx = text.find('{\"primary_intent\"')\n\
          \    if start_idx == -1:\n        start_idx = text.find('{\\n  \"primary_intent\"')\n        \n    if start_idx\
          \ != -1:\n        end_idx = text.rfind(\"}\")\n        if end_idx > start_idx:\n            try:\n             \
          \   return json.loads(text[start_idx:end_idx+1])\n            except Exception:\n                pass\n\n    # 兜底：找第一个\
          \ { 和最后一个 }\n    l, r = text.find(\"{\"), text.rfind(\"}\")\n    if l != -1 and r != -1 and r > l:\n        try:\n\
          \            return json.loads(text[l:r+1])\n        except Exception:\n            pass\n    return {}\n\n\n# ============================================================\n\
          # 2. 主函数\n# ============================================================\ndef main(item: dict, indexes_json: str,\
          \ llm_intent_json: str) -> dict:\n    try:\n        indexes = json.loads(indexes_json) if indexes_json else {}\n\
          \        snap_by_svc = indexes.get(\"snapshot_by_service\", {})\n        dup_snaps = indexes.get(\"duplicate_snapshot_services\"\
          , {})\n        cust_by_id = indexes.get(\"customer_by_id\", {})\n        rules_by_key = indexes.get(\"rules_by_key\"\
          , {})\n        open_tk_by_key = indexes.get(\"open_tickets_by_key\", {})\n\n        # 解析 LLM 意图\n        intent_obj\
          \ = _extract_json(llm_intent_json)\n        primary_intent = intent_obj.get(\"primary_intent\", \"OTHER\")\n   \
          \     secondary_intents = intent_obj.get(\"secondary_intents\", [])\n        if not isinstance(secondary_intents,\
          \ list):\n            secondary_intents = []\n\n        # ============================================================\n\
          \        # \U0001F680 LLM 兜底纠偏机制（防止 LLM 误判为 OTHER）\n        # ============================================================\n\
          \        text = item.get(\"complaint_text\", \"\")\n        if primary_intent == \"OTHER\":\n            if any(k\
          \ in text for k in [\"手机\", \"信号\", \"无服务\", \"没信号\", \"5G\", \"移动网络\", \"上网\"]):\n                primary_intent\
          \ = \"MOBILE_NETWORK\"\n            elif any(k in text for k in [\"宽带\", \"断网\", \"断线\", \"光猫\", \"卡顿\", \"连不上\"\
          ]):\n                if any(k in text for k in [\"新装\", \"预约\", \"安装\", \"完工\", \"验收\"]):\n                    primary_intent\
          \ = \"INSTALL_DELAY\"\n                else:\n                    primary_intent = \"BROADBAND_FAULT\"\n       \
          \     elif any(k in text for k in [\"账单\", \"扣费\", \"多扣\", \"多收\", \"收费\", \"月费\", \"套餐\"]):\n                primary_intent\
          \ = \"BILLING_DISPUTE\"\n\n        case_id = item.get(\"case_id\", \"\")\n        customer_id = item.get(\"customer_id\"\
          , \"\")\n        service_id = item.get(\"service_id\", \"\")\n        service_type = item.get(\"service_type\",\
          \ \"\")\n        region = item.get(\"region\", \"\")\n        received_at_str = item.get(\"received_at\", \"\")\n\
          \n        result = {\n            \"case_id\": case_id, \"customer_id\": customer_id, \"service_id\": service_id,\n\
          \            \"primary_intent\": primary_intent, \"secondary_intents\": secondary_intents,\n            \"verification_result\"\
