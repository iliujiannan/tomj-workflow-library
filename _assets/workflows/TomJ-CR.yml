    - data:
        code: "import json\n\ndef main(results_list: list) -> dict:\n    results = []\n    for r_str in results_list:\n  \
          \      try:\n            results.append(json.loads(r_str))\n        except Exception:\n            continue\n  \
          \  results.sort(key=lambda x: x.get(\"case_id\", \"\"))\n\n    actions = {\"CREATE\": 0, \"MERGE\": 0, \"MANUAL_REVIEW\"\
          : 0, \"NO_TICKET\": 0}\n    intents = {\n        \"BILLING_DISPUTE\": 0, \"MOBILE_NETWORK\": 0, \"BROADBAND_FAULT\"\
          : 0,\n        \"INSTALL_DELAY\": 0, \"SERVICE_ATTITUDE\": 0, \"POSITIVE_FEEDBACK\": 0\n    }\n\n    for r in results:\n\
          \        action = r.get(\"ticket_action\", \"\")\n        if action in actions: actions[action] += 1\n        p_intent\
          \ = r.get(\"primary_intent\", \"\")\n        if p_intent in intents: intents[p_intent] += 1\n\n    # ✅ AntV 插件要求的格式：必须是\
          \ category 和 value\n    action_data = [{\"category\": k, \"value\": v} for k, v in actions.items()]\n    intent_data\
          \ = [{\"category\": k, \"value\": v} for k, v in intents.items()]\n\n    context = {\n        \"results\": results,\n\
          \        \"actions\": actions\n    }\n\n    return {\n        \"action_chart_data\": json.dumps(action_data, ensure_ascii=False),\n\
          \        \"intent_chart_data\": json.dumps(intent_data, ensure_ascii=False),\n        \"summary_json\": json.dumps(context,\
          \ ensure_ascii=False)\n    }"
        code_language: python3
        outputs:
          action_chart_data:
            children: null
            type: string
          intent_chart_data:
            children: null
            type: string
          summary_json:
            children: null
            type: string
