    - data:
        code: "import re\nfrom collections import OrderedDict\n\nCOLUMN_MAP = {\n    \"complaint_id\": \"complaint_id\", \"\
          投诉id\": \"complaint_id\", \"投诉号\": \"complaint_id\",\n    \"accept_time\": \"accept_time\",\n    \"customer_id\"\
          : \"customer_id\", \"客户编号\": \"customer_id\", \"客户id\": \"customer_id\",\n    \"handler_name\": \"handler_name\"\
          , \"员工姓名\": \"handler_name\",\n    \"package_type\": \"package_type\",\n    \"complaint_description\": \"complaint_description\"\
          ,\n    \"complaint_type\": \"complaint_type\",\n    \"complaint_subtype\": \"complaint_subtype\",\n    \"handler_id\"\
          : \"handler_id\", \"员工id\": \"handler_id\", \"员工编号\": \"handler_id\",\n    \"hall_id\": \"hall_id\", \"营业厅id\":\
          \ \"hall_id\", \"营业厅编号\": \"hall_id\",\n    \"customer_feedback\": \"customer_feedback\",\n    \"customer_name\"\
          : \"customer_name\", \"客户姓名\": \"customer_name\",\n    \"customer_level\": \"customer_level\",\n    \"hall_name\"\
          : \"hall_name\", \"营业厅名称\": \"hall_name\",\n    \"region\": \"region\",\n}\n\nREC_FIELDS      = [\"complaint_id\"\
          , \"accept_time\", \"customer_id\", \"handler_name\", \"package_type\", \"complaint_description\", \"complaint_type\"\
          , \"complaint_subtype\", \"source_row_index\"]\nHAND_FIELDS     = [\"complaint_id\", \"handler_id\", \"hall_id\"\
          , \"accept_time\", \"customer_feedback\", \"customer_name\", \"source_row_index\"]\nCUSTOMER_FIELDS = [\"customer_id\"\
          , \"customer_name\", \"customer_level\", \"source_row_index\"]\nEMPLOYEE_FIELDS = [\"handler_id\", \"handler_name\"\
          , \"hall_id\", \"source_row_index\"]\nHALL_FIELDS     = [\"hall_id\", \"hall_name\", \"region\", \"source_row_index\"\
          ]\n\ndef _norm_header(h): return str(h).strip().lstrip(\"\\ufeff\").lower()\n\ndef _split_md_row(line):\n    s =\
          \ line.strip()\n    if s.startswith(\"|\"): s = s[1:]\n    if s.endswith(\"|\"): s = s[:-1]\n    cells, buf, i =\
          \ [], \"\", 0\n    while i < len(s):\n        if s[i] == \"\\\\\" and i + 1 < len(s) and s[i + 1] == \"|\":\n  \
          \          buf += \"|\"\n            i += 2\n        elif s[i] == \"|\":\n            cells.append(buf.strip())\n\
          \            buf = \"\"\n            i += 1\n        else:\n            buf += s[i]\n            i += 1\n    cells.append(buf.strip())\n\
          \    return cells\n\ndef _is_separator_row(cells):\n    has_dash = False\n    for c in cells:\n        c = c.strip()\n\
          \        if not c: continue\n        if not re.fullmatch(r\":?-+:?\", c): return False\n        has_dash = True\n\
          \    return has_dash\n\ndef _parse_markdown_table(text):\n    if not text or not str(text).strip(): return []\n\
          \    lines = str(text).split(\"\\n\")\n    table_lines, in_table = [], False\n    for line in lines:\n        s\
          \ = line.strip()\n        if s.startswith(\"|\"):\n            in_table = True\n            table_lines.append(s)\n\
          \        elif in_table:\n            if s == \"\": continue\n            break\n    if len(table_lines) < 2: return\
          \ []\n    header = [_norm_header(h) for h in _split_md_row(table_lines[0])]\n    rows, idx = [], 0\n    for line\
          \ in table_lines[1:]:\n        cells = _split_md_row(line)\n        if _is_separator_row(cells): continue\n    \
          \    if len(cells) < len(header): cells = cells + [\"\"] * (len(header) - len(cells))\n        d = OrderedDict()\n\
          \        for i, h in enumerate(header): d[h] = cells[i] if i < len(cells) else \"\"\n        rows.append((idx, d))\n\
          \        idx += 1\n    return rows\n\ndef _standardize(parsed, fields):\n    std_fields = fields[:-1]\n    all_have_sri\
          \ = len(parsed) > 0\n    for _, raw in parsed:\n        v = raw.get(\"source_row_index\", \"\")\n        if v is\
          \ None or not str(v).strip().isdigit():\n            all_have_sri = False\n            break\n    out = []\n   \
          \ for idx, raw in parsed:\n        mapped, extras = {}, OrderedDict()\n        for h, val in raw.items():\n    \
          \        std = COLUMN_MAP.get(h)\n            if std:\n                if std not in mapped: mapped[std] = val\n\
          \            else:\n                extras[h] = val\n        row = OrderedDict()\n        for f in std_fields: row[f]\
          \ = mapped.get(f, \"\")\n        for k, v in extras.items():\n            if k == \"source_row_index\": continue\n\
          \            if k not in row: row[k] = v\n        row[\"source_row_index\"] = str(extras.get(\"source_row_index\"\
          , \"\")).strip() if all_have_sri else str(idx)\n        out.append(row)\n    return out\n\ndef _esc(v):\n    s =\
          \ \"\" if v is None else str(v)\n    return s.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").replace(\"\
          |\", \"\\\\|\").replace(\"\\n\", \"<br>\")\n\ndef _markdown_table(fields, rows):\n    lines = [\"| \" + \" | \"\
          .join(fields) + \" |\", \"| \" + \" | \".join([\"---\"] * len(fields)) + \" |\"]\n    for r in rows:\n        lines.append(\"\
          | \" + \" | \".join(_esc(r.get(f, \"\")) for f in fields) + \" |\")\n    return \"\\n\".join(lines)\n\ndef main(complaint_record_text=\"\
          \", complaint_handling_text=\"\", customer_info_text=\"\", employee_info_text=\"\", hall_info_text=\"\"):\n    try:\n\
          \        rec_rows = _standardize(_parse_markdown_table(complaint_record_text), REC_FIELDS)\n        hand_rows =\
          \ _standardize(_parse_markdown_table(complaint_handling_text), HAND_FIELDS)\n        cust_rows = _standardize(_parse_markdown_table(customer_info_text),\
          \ CUSTOMER_FIELDS)\n        emp_rows = _standardize(_parse_markdown_table(employee_info_text), EMPLOYEE_FIELDS)\n\
          \        hall_rows = _standardize(_parse_markdown_table(hall_info_text), HALL_FIELDS)\n\n        return {\n    \
          \        \"record_text\": _markdown_table(REC_FIELDS, rec_rows),\n            \"handling_text\": _markdown_table(HAND_FIELDS,\
          \ hand_rows),\n            \"customer_text\": _markdown_table(CUSTOMER_FIELDS, cust_rows),\n            \"employee_text\"\
          : _markdown_table(EMPLOYEE_FIELDS, emp_rows),\n            \"hall_text\": _markdown_table(HALL_FIELDS, hall_rows),\n\
          \            \"parse_ok\": True,\n            \"parse_msg\": \"解析成功\"\n        }\n    except Exception as e:\n \
          \       return {\n            \"record_text\": \"\", \"handling_text\": \"\", \"customer_text\": \"\", \"employee_text\"\
          : \"\", \"hall_text\": \"\",\n            \"parse_ok\": False, \"parse_msg\": str(e)\n        }"
