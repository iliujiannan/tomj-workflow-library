    - data:
        code: "import re\nimport datetime\nimport json\nfrom collections import OrderedDict\n\nREC_FIELDS      = [\"complaint_id\"\
          , \"accept_time\", \"customer_id\", \"handler_name\", \"package_type\", \"complaint_description\", \"complaint_type\"\
          , \"complaint_subtype\", \"source_row_index\"]\nHAND_FIELDS     = [\"complaint_id\", \"handler_id\", \"hall_id\"\
          , \"accept_time\", \"customer_feedback\", \"customer_name\", \"source_row_index\"]\nCUSTOMER_FIELDS = [\"customer_id\"\
          , \"customer_name\", \"customer_level\", \"source_row_index\"]\nEMPLOYEE_FIELDS = [\"handler_id\", \"handler_name\"\
          , \"hall_id\", \"source_row_index\"]\nHALL_FIELDS     = [\"hall_id\", \"hall_name\", \"region\", \"source_row_index\"\
          ]\nMONTHS = {\"jan\": 1, \"feb\": 2, \"mar\": 3, \"apr\": 4, \"may\": 5, \"jun\": 6, \"jul\": 7, \"aug\": 8, \"\
          sep\": 9, \"oct\": 10, \"nov\": 11, \"dec\": 12}\n\ndef _norm_header(h): return str(h).strip().lstrip(\"\\ufeff\"\
          ).lower()\n\ndef _split_md_row(line):\n    s = line.strip()\n    if s.startswith(\"|\"): s = s[1:]\n    if s.endswith(\"\
          |\"): s = s[:-1]\n    cells, buf, i = [], \"\", 0\n    while i < len(s):\n        if s[i] == \"\\\\\" and i + 1\
          \ < len(s) and s[i + 1] == \"|\":\n            buf += \"|\"\n            i += 2\n        elif s[i] == \"|\":\n \
          \           cells.append(buf.strip())\n            buf = \"\"\n            i += 1\n        else:\n            buf\
          \ += s[i]\n            i += 1\n    cells.append(buf.strip())\n    return cells\n\ndef _is_separator_row(cells):\n\
          \    has_dash = False\n    for c in cells:\n        c = c.strip()\n        if not c: continue\n        if not re.fullmatch(r\"\
          :?-+:?\", c): return False\n        has_dash = True\n    return has_dash\n\ndef _parse_markdown_table(text):\n \
          \   if not text or not str(text).strip(): return []\n    lines = str(text).split(\"\\n\")\n    table_lines, in_table\
          \ = [], False\n    for line in lines:\n        s = line.strip()\n        if s.startswith(\"|\"):\n            in_table\
          \ = True\n            table_lines.append(s)\n        elif in_table:\n            if s == \"\": continue\n      \
          \      break\n    if len(table_lines) < 2: return []\n    header = [_norm_header(h) for h in _split_md_row(table_lines[0])]\n\
          \    rows = []\n    for line in table_lines[1:]:\n        cells = _split_md_row(line)\n        if _is_separator_row(cells):\
          \ continue\n        if len(cells) < len(header): cells = cells + [\"\"] * (len(header) - len(cells))\n        d\
          \ = OrderedDict()\n        for i, h in enumerate(header): d[h] = cells[i] if i < len(cells) else \"\"\n        rows.append(d)\n\
          \    return rows\n\ndef _parse_numeric_date_parts(a, b, c, sep):\n    if len(a) == 4: return int(a), int(b), int(c)\n\
          \    if len(c) == 4:\n        x, y = int(a), int(b)\n        if x > 12: return int(c), y, x\n        if y > 12:\
          \ return int(c), x, y\n        if sep == \"/\": return int(c), x, y\n        return int(c), y, x\n    year = 2000\
          \ + int(a) if len(a) == 2 else int(a)\n    return year, int(b), int(c)\n\ndef _parse_time_smart(s):\n    orig =\
          \ \"\" if s is None else str(s).strip()\n    if orig == \"\": return \"\", False\n    text = orig.replace(\"：\"\
          , \":\").replace(\"／\", \"/\").replace(\"．\", \".\")\n    base = bool(re.fullmatch(r\"\\d{4}/\\d{1,2}/\\d{1,2}\\\
          s+\\d{1,2}:\\d{1,2}(?::\\d{1,2})?\", text))\n    tm = re.search(r\"(\\d{1,2}):(\\d{1,2})(?::(\\d{1,2}))?\\s*([AaPp][Mm])?\"\
          , text)\n    hour = minute = 0\n    has_colon_time = False\n    if tm:\n        has_colon_time = True\n        hour,\
          \ minute = int(tm.group(1)), int(tm.group(2))\n        if tm.group(4):\n            ap = tm.group(4).upper()\n \
          \           if ap == \"PM\" and hour < 12: hour += 12\n            if ap == \"AM\" and hour == 12: hour = 0\n  \
          \      if hour > 23 or minute > 59: return \"\", False\n    date_parts, extra_time = None, None\n    m = re.search(r\"\
          (\\d{4})\\s*年\\s*(\\d{1,2})\\s*月\\s*(\\d{1,2})\\s*日\", text)\n    if m: date_parts = (int(m.group(1)), int(m.group(2)),\
          \ int(m.group(3)))\n    if date_parts is None:\n        m = re.search(r\"([A-Za-z]{3,9})\\s+(\\d{1,2}),?\\s+(\\\
          d{4})\", text)\n        if m:\n            mon = MONTHS.get(m.group(1).lower()[:3])\n            if mon: date_parts\
          \ = (int(m.group(3)), mon, int(m.group(2)))\n        else:\n            m = re.search(r\"(\\d{1,2})\\s+([A-Za-z]{3,9})\\\
          s+(\\d{4})\", text)\n            if m:\n                mon = MONTHS.get(m.group(2).lower()[:3])\n             \
          \   if mon: date_parts = (int(m.group(3)), mon, int(m.group(1)))\n    if date_parts is None:\n        m = re.search(r\"\
          (\\d{1,4})[/\\-.](\\d{1,2})[/\\-.](\\d{1,4})\", text)\n        if m:\n            sep_m = re.search(r\"[/\\-.]\"\
          , m.group(0))\n            sep = sep_m.group(0) if sep_m else \"/\"\n            date_parts = _parse_numeric_date_parts(m.group(1),\
          \ m.group(2), m.group(3), sep)\n    if date_parts is None:\n        m = re.search(r\"(?<!\\d)(\\d{14}|\\d{12}|\\\
          d{8})(?!\\d)\", text)\n        if m:\n            digits = m.group(1)\n            if len(digits) == 14:\n     \
          \           date_parts = (int(digits[0:4]), int(digits[4:6]), int(digits[6:8]))\n                extra_time = (int(digits[8:10]),\
          \ int(digits[10:12]))\n            elif len(digits) == 12:\n                date_parts = (int(digits[0:4]), int(digits[4:6]),\
          \ int(digits[6:8]))\n                extra_time = (int(digits[8:10]), int(digits[10:12]))\n            else: date_parts\
          \ = (int(digits[0:4]), int(digits[4:6]), int(digits[6:8]))\n    if date_parts is None: return \"\", False\n    if\
          \ extra_time is not None and not has_colon_time:\n        hour, minute = extra_time\n        if hour > 23 or minute\
          \ > 59: return \"\", False\n    year, month, day = date_parts\n    try: dt = datetime.datetime(year, month, day,\
          \ hour, minute)\n    except: return \"\", False\n    out = dt.strftime(\"%Y/%m/%d %H:%M\")\n    return out, (not\
          \ base)\n\ndef _esc(v):\n    s = \"\" if v is None else str(v)\n    return s.replace(\"\\r\\n\", \"\\n\").replace(\"\
          \\r\", \"\\n\").replace(\"|\", \"\\\\|\").replace(\"\\n\", \"<br>\")\n\ndef _markdown_table(fields, rows):\n   \
          \ lines = [\"| \" + \" | \".join(fields) + \" |\", \"| \" + \" | \".join([\"---\"] * len(fields)) + \" |\"]\n  \
          \  for r in rows:\n        lines.append(\"| \" + \" | \".join(_esc(r.get(f, \"\")) for f in fields) + \" |\")\n\
          \    return \"\\n\".join(lines)\n\ndef main(record_text=\"\", handling_text=\"\", customer_text=\"\", employee_text=\"\
          \", hall_text=\"\"):\n    rec_rows = _parse_markdown_table(record_text)\n    hand_rows = _parse_markdown_table(handling_text)\n\
          \    cust_rows = _parse_markdown_table(customer_text)\n    emp_rows = _parse_markdown_table(employee_text)\n   \
          \ hall_rows = _parse_markdown_table(hall_text)\n\n    rec_fix, hand_fix = 0, 0\n    for r in rec_rows:\n       \
          \ new, repaired = _parse_time_smart(r.get(\"accept_time\", \"\"))\n        r[\"accept_time\"] = new\n        if\
          \ repaired: rec_fix += 1\n    for r in hand_rows:\n        new, repaired = _parse_time_smart(r.get(\"accept_time\"\
          , \"\"))\n        r[\"accept_time\"] = new\n        if repaired: hand_fix += 1\n\n    stats = {\n        \"complaint_record_time_repair_count\"\
          : rec_fix,\n        \"complaint_handling_time_repair_count\": hand_fix\n    }\n\n    return {\n        \"record_text\"\
          : _markdown_table(REC_FIELDS, rec_rows),\n        \"handling_text\": _markdown_table(HAND_FIELDS, hand_rows),\n\
          \        \"customer_text\": _markdown_table(CUSTOMER_FIELDS, cust_rows),\n        \"employee_text\": _markdown_table(EMPLOYEE_FIELDS,\
          \ emp_rows),\n        \"hall_text\": _markdown_table(HALL_FIELDS, hall_rows),\n        \"stats_04\": json.dumps(stats,\
          \ ensure_ascii=False)\n    }"
        code_language: python3
