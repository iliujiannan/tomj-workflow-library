    - data:
        code: "import json\nfrom datetime import datetime\n\nSTATE_CN = {\"KEEP_ACTIVE\": \"保持运行\", \"LIGHT_SLEEP\": \"轻载节能\"\
          , \"DEEP_SLEEP\": \"深度休眠\"}\nREASON_CN = {\n    \"COVERAGE_ANCHOR\": \"覆盖锚点保障\",\n    \"TEMP_GUARANTEE\": \"临时保障限制\"\
          ,\n    \"LOAD_ABOVE_DEEP\": \"负载高于深休眠阈值，采用轻载节能\",\n    \"DEEP_ALLOWED\": \"负载满足深度休眠条件\",\n    \"DEEP_ELIGIBLE\"\
          : \"负载满足深度休眠条件\",\n    \"DEEP_DURATION_LIMIT\": \"达到连续深度休眠上限\",\n    \"LOAD_ABOVE_LIGHT\": \"负载较高，保持运行\",\n    \"\
          LIGHT_ELIGIBLE\": \"负载满足轻载节能条件\",\n    \"LIGHT_NOT_FEASIBLE\": \"轻载条件不满足，保持运行\",\n    \"NO_NET_SAVING\": \"无正净收益\"\
          ,\n    \"RECEIVER_CAPACITY\": \"承接方容量不足\",\n}\n\ndef _fmt2(x):\n    try:\n        return f\"{float(x):.2f}\"\n \
          \   except Exception:\n        return \"-\"\n\ndef _fmt_qty(x):\n    try:\n        v = float(x)\n        return\
          \ str(int(v)) if abs(v - int(v)) < 1e-9 else f\"{v:.2f}\"\n    except Exception:\n        return str(x)\n\ndef main(tables_json,\
          \ rules_json):\n    tables = json.loads(tables_json)\n    rules = json.loads(rules_json or \"{}\")\n\n    def rnum(key,\
          \ default):\n        try:\n            return float(rules.get(key, default))\n        except Exception:\n      \
          \      return float(default)\n\n    deep_ratio = rnum(\"deep_load_ratio_max\", 0.2)\n    light_ratio = rnum(\"light_load_ratio_max\"\
          , 0.5)\n    max_util = rnum(\"max_utilization_ratio\", 0.8)\n    max_consec = int(rnum(\"max_consecutive_deep_slots\"\
          , 2))\n    switch_wh = rnum(\"switch_energy_wh\", 5)\n    min_save = rnum(\"minimum_incremental_saving_wh\", 0)\n\
          \n    params = {}\n    for p in tables[\"power\"]:\n        params[(p[\"model_id\"], p[\"state\"])] = {\n      \
          \      \"cap\": float(p[\"capacity_units\"]),\n            \"base\": float(p[\"base_power_w\"]),\n            \"\
          slope\": float(p[\"slope_w_per_unit\"]),\n        }\n\n    def pget(model_id, state):\n        if (model_id, state)\
          \ not in params:\n            raise Exception(f\"缺少功耗参数 {model_id}/{state}\")\n        return params[(model_id,\
          \ state)]\n\n    cells = {c[\"cell_id\"]: c for c in tables[\"cells\"]}\n    cell_ids = sorted(cells.keys())\n \
          \   slots = sorted(tables[\"slots\"], key=lambda x: datetime.fromisoformat(x[\"start_time\"]))\n    demand_map =\
          \ {(d[\"slot_id\"], d[\"cell_id\"]): float(d[\"demand_units\"]) for d in tables[\"demands\"]}\n\n    restrictions\
          \ = []\n    for r in tables[\"restrictions\"]:\n        restrictions.append({\n            \"cell_id\": r[\"cell_id\"\
          ],\n            \"type\": r[\"restriction_type\"],\n            \"start\": datetime.fromisoformat(r[\"start_time\"\
          ]),\n            \"end\": datetime.fromisoformat(r[\"end_time\"]),\n        })\n\n    transfers_by_source = {}\n\
          \    for t in tables[\"transfer\"]:\n        transfers_by_source.setdefault(t[\"source_cell_id\"], []).append(t)\n\
          \    for k in transfers_by_source:\n        transfers_by_source[k].sort(key=lambda x: (int(x[\"priority\"]), x[\"\
          target_cell_id\"]))\n\n    coverage = [{\n        \"group_id\": r[\"group_id\"],\n        \"anchor_cell_id\": r[\"\
          anchor_cell_id\"],\n        \"min_active_cells\": int(r[\"min_active_cells\"]),\n    } for r in tables[\"coverage\"\
          ]]\n\n    prev_state = {c: cells[c][\"initial_state\"] for c in cell_ids}\n    deep_count = {c: int(cells[c][\"\
          initial_deep_slots\"]) for c in cell_ids}\n\n    rows = []\n    slot_summaries = []\n    \n    # 收集异常\n    cell_errors\
          \ = {}\n    slot_errors = {}\n    global_errors = []\n    energy_recheck_ok = True\n\n    for slot in slots:\n \
          \       sid = slot[\"slot_id\"]\n        dur = float(slot[\"duration_hours\"])\n        start_time = slot[\"start_time\"\
          ]\n        end_time = slot[\"end_time\"]\n        sdt = datetime.fromisoformat(start_time)\n        edt = datetime.fromisoformat(end_time)\n\
          \n        demand = {c: float(demand_map.get((sid, c), 0.0)) for c in cell_ids}\n        final_load = dict(demand)\n\
          \        chosen = {}\n        reason_code = {}\n        receiver = {}\n        t_out = {c: 0.0 for c in cell_ids}\n\
          \        t_in = {c: 0.0 for c in cell_ids}\n\n        for c in cell_ids:\n            cell = cells[c]\n        \
          \    model_id = cell[\"model_id\"]\n\n            if cell[\"role\"] == \"ANCHOR\":\n                chosen[c] =\
          \ \"KEEP_ACTIVE\"\n                reason_code[c] = \"COVERAGE_ANCHOR\"\n                continue\n\n          \
          \  forced = False\n            for r in restrictions:\n                if r[\"cell_id\"] == c and r[\"type\"] ==\
          \ \"FORCE_ACTIVE\" and r[\"start\"] < edt and r[\"end\"] > sdt:\n                    forced = True\n           \
          \         break\n            if forced:\n                chosen[c] = \"KEEP_ACTIVE\"\n                reason_code[c]\
          \ = \"TEMP_GUARANTEE\"\n                continue\n\n            orig = demand[c]\n            normal_cap = pget(model_id,\
          \ \"KEEP_ACTIVE\")[\"cap\"]\n            ratio = orig / normal_cap if normal_cap > 0 else 999.0\n            deep_reason\
          \ = None\n            light_reason = None\n\n            if ratio > deep_ratio:\n                deep_reason = \"\
          LOAD_ABOVE_DEEP\"\n            elif deep_count[c] >= max_consec:\n                deep_reason = \"DEEP_DURATION_LIMIT\"\
          \n            else:\n                rels = transfers_by_source.get(c, [])\n                if not rels:\n     \
          \               deep_reason = \"RECEIVER_CAPACITY\"\n                else:\n                    rel = rels[0]\n\
          \                    target = rel[\"target_cell_id\"]\n                    amount = final_load[c]\n            \
          \        if orig > float(rel[\"max_transfer_units\"]) or amount > float(rel[\"max_transfer_units\"]):\n        \
          \                deep_reason = \"RECEIVER_CAPACITY\"\n                    else:\n                        tmodel\
          \ = cells[target][\"model_id\"]\n                        tcap = pget(tmodel, \"KEEP_ACTIVE\")[\"cap\"]\n       \
          \                 if final_load[target] + amount > tcap * max_util + 1e-9:\n                            deep_reason\
          \ = \"RECEIVER_CAPACITY\"\n                        else:\n                            switch_deep = 0.0 if prev_state[c]\
          \ == \"DEEP_SLEEP\" else switch_wh\n                            dp = pget(model_id, \"DEEP_SLEEP\")\n          \
          \                  deep_energy = (dp[\"base\"] + dp[\"slope\"] * 0.0) * dur\n                            rec_delta\
          \ = pget(tmodel, \"KEEP_ACTIVE\")[\"slope\"] * amount * dur\n                            kp = pget(model_id, \"\
          KEEP_ACTIVE\")\n                            baseline = (kp[\"base\"] + kp[\"slope\"] * orig) * dur\n           \
          \                 inc = baseline - (deep_energy + switch_deep + rec_delta)\n                            if inc <=\
          \ min_save + 1e-9:\n                                deep_reason = \"NO_NET_SAVING\"\n                          \
          \  else:\n                                chosen[c] = \"DEEP_SLEEP\"\n                                reason_code[c]\
          \ = \"DEEP_ELIGIBLE\"\n                                receiver[c] = target\n                                t_out[c]\
          \ = amount\n                                t_in[target] += amount\n                                final_load[target]\
          \ += amount\n                                final_load[c] = 0.0\n\n            if c not in chosen:\n          \
          \      if ratio > light_ratio:\n                    light_reason = \"LOAD_ABOVE_LIGHT\"\n                else:\n\
          \                    lp = params.get((model_id, \"LIGHT_SLEEP\"))\n                    if not lp or lp[\"cap\"]\
          \ <= 0 or final_load[c] > lp[\"cap\"] * max_util + 1e-9:\n                        light_reason = \"LIGHT_NOT_FEASIBLE\"\
          \n                    else:\n                        switch_light = 0.0 if prev_state[c] == \"LIGHT_SLEEP\" else\
          \ switch_wh\n                        light_energy = (lp[\"base\"] + lp[\"slope\"] * orig) * dur\n              \
          \          kp = pget(model_id, \"KEEP_ACTIVE\")\n                        baseline = (kp[\"base\"] + kp[\"slope\"\
          ] * orig) * dur\n                        inc = baseline - (light_energy + switch_light)\n                      \
          \  if inc <= min_save + 1e-9:\n                            light_reason = \"NO_NET_SAVING\"\n                  \
          \      else:\n                            chosen[c] = \"LIGHT_SLEEP\"\n                            reason_code[c]\
          \ = deep_reason or \"LIGHT_ELIGIBLE\"\n\n            if c not in chosen:\n                chosen[c] = \"KEEP_ACTIVE\"\
          \n                if ratio > light_ratio:\n                    reason_code[c] = \"LOAD_ABOVE_LIGHT\"\n         \
          \       elif light_reason:\n                    reason_code[c] = light_reason\n                elif deep_reason:\n\
          \                    reason_code[c] = deep_reason\n                else:\n                    reason_code[c] = \"\
          LIGHT_NOT_FEASIBLE\"\n\n        for c in cell_ids:\n            cell = cells[c]\n            model_id = cell[\"\
          model_id\"]\n            st = chosen[c]\n            pst = pget(model_id, st)\n            cap = pst[\"cap\"]\n\
          \            orig = demand[c]\n            final = final_load[c]\n            util = final / cap if cap > 0 else\
          \ None\n            \n            row_risk = \"PASS\"\n            # 核心容量校验\n            if cap > 0 and util > max_util\
          \ + 1e-6:\n                row_risk = \"FAIL\"\n                err_msg = f\"最终业务量 {float(final)} 超过容量上限 {float(cap)}\
          \ × {max_util} = {cap * max_util}\"\n                cell_errors.setdefault(f\"{sid}-{c}\", []).append(err_msg)\n\
          \            if st == \"DEEP_SLEEP\" and abs(final) > 1e-9:\n                row_risk = \"FAIL\"\n             \
          \   cell_errors.setdefault(f\"{sid}-{c}\", []).append(\"深休眠最终业务量不为0\")\n\n            switch = 0.0 if prev_state[c]\
          \ == st else switch_wh\n            kp = pget(model_id, \"KEEP_ACTIVE\")\n            baseline = (kp[\"base\"] +\
          \ kp[\"slope\"] * orig) * dur\n            strategy_energy = (pst[\"base\"] + pst[\"slope\"] * final) * dur + switch\n\
          \            saving = baseline - strategy_energy\n            \n            rows.append({\n                \"slot_id\"\
          : sid, \"start_time\": start_time, \"end_time\": end_time,\n                \"duration_hours\": dur, \"cell_id\"\
          : c, \"scene\": cell[\"scene\"],\n                \"role\": cell[\"role\"], \"coverage_group\": cell[\"coverage_group\"\
          ],\n                \"model_id\": model_id, \"state\": st, \"state_cn\": STATE_CN.get(st, st),\n               \
          \ \"reason_code\": reason_code.get(c, \"\"), \"reason_cn\": REASON_CN.get(reason_code.get(c, \"\"), reason_code.get(c,\
          \ \"\")),\n                \"demand\": orig, \"transfer_in\": t_in[c], \"transfer_out\": t_out[c],\n           \
          \     \"final_load\": final, \"capacity\": cap, \"utilization\": util,\n                \"receiver\": receiver.get(c,\
          \ \"-\") if st == \"DEEP_SLEEP\" else \"-\",\n                \"switch_energy_wh\": switch, \"baseline_energy_wh\"\
          : baseline,\n                \"strategy_energy_wh\": strategy_energy, \"saving_wh\": saving,\n                \"\
          risk_status\": row_risk,\n            })\n\n        slot_rows = rows[-len(cell_ids):]\n        counts = {\"KEEP_ACTIVE\"\
          : 0, \"LIGHT_SLEEP\": 0, \"DEEP_SLEEP\": 0}\n        for r in slot_rows:\n            counts[r[\"state\"]] += 1\n\
          \        slot_summaries.append({\n            \"slot_id\": sid, \"start_time\": start_time, \"end_time\": end_time,\
          \ \"duration_hours\": dur,\n            \"KEEP_ACTIVE\": counts[\"KEEP_ACTIVE\"], \"LIGHT_SLEEP\": counts[\"LIGHT_SLEEP\"\
          ], \"DEEP_SLEEP\": counts[\"DEEP_SLEEP\"],\n            \"baseline_energy_wh\": round(sum(r[\"baseline_energy_wh\"\
          ] for r in slot_rows), 2),\n            \"strategy_energy_wh\": round(sum(r[\"strategy_energy_wh\"] for r in slot_rows),\
          \ 2),\n            \"switch_energy_wh\": round(sum(r[\"switch_energy_wh\"] for r in slot_rows), 2),\n          \
          \  \"saving_wh\": round(sum(r[\"saving_wh\"] for r in slot_rows), 2),\n            \"transfer_count\": sum(1 for\
          \ r in slot_rows if r[\"transfer_out\"] > 0),\n        })\n\n        for c in cell_ids:\n            if chosen[c]\
          \ == \"DEEP_SLEEP\":\n                deep_count[c] += 1\n            else:\n                deep_count[c] = 0\n\
          \            prev_state[c] = chosen[c]\n\n    strategy_counts = {\"KEEP_ACTIVE\": 0, \"LIGHT_SLEEP\": 0, \"DEEP_SLEEP\"\
          : 0}\n    for r in rows:\n        strategy_counts[r[\"state\"]] += 1\n\n    total_base = sum(r[\"baseline_energy_wh\"\
          ] for r in rows)\n    total_strategy = sum(r[\"strategy_energy_wh\"] for r in rows)\n    total_switch = sum(r[\"\
          switch_energy_wh\"] for r in rows)\n    total_saving = total_base - total_strategy\n    total_transfer = sum(1 for\
          \ r in rows if r[\"transfer_out\"] > 0)\n    saving_rate = (total_saving / total_base * 100.0) if total_base else\
          \ 0.0\n\n    summary_obj = {\n        \"baseline_energy_wh\": round(total_base, 2), \"cell_count\": len(cell_ids),\n\
          \        \"saving_rate_percent\": round(saving_rate, 6), \"saving_wh\": round(total_saving, 2),\n        \"slot_count\"\
          : len(slots), \"slot_summaries\": slot_summaries,\n        \"strategy_counts\": strategy_counts, \"strategy_energy_wh\"\
          : round(total_strategy, 2),\n        \"switch_energy_wh\": round(total_switch, 2), \"total_rows\": len(rows),\n\
          \        \"transfer_count\": total_transfer,\n    }\n\n    detail_lines = [\n        \"| 时段 | 小区 | 场景 | 策略 | 原因说明\
          \ | 原始业务量 | 转入 | 转出 | 最终业务量 | 容量 | 利用率 | 承接小区 | 切换能耗(Wh) | 基准能耗(Wh) | 策略能耗(Wh) | 节能量(Wh) | 风险状态 |\",\n        \"\
          | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\",\n   \
          \ ]\n    for r in rows:\n        util = \"-\" if r[\"capacity\"] <= 0 else f\"{r['utilization'] * 100:.2f}%\"\n\
          \        receiver = r[\"receiver\"] if r[\"state\"] == \"DEEP_SLEEP\" else \"-\"\n        detail_lines.append(\n\
