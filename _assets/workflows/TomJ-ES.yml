          \        return [], []\n    lines = [ln for ln in text.replace(\"\\r\\n\",\"\\n\").replace(\"\\r\",\"\\n\").split(\"\
          \\n\") if ln.strip()!=\"\"]\n    if lines and lines[0].strip().startswith(\"|\"):\n        def split_md(line):\n\
          \            s = line.strip()\n            if s.startswith(\"|\"): s = s[1:]\n            if s.endswith(\"|\"):\
          \ s = s[:-1]\n            cells, buf, i = [], \"\", 0\n            while i < len(s):\n                if s[i] ==\
          \ \"\\\\\" and i + 1 < len(s) and s[i + 1] == \"|\":\n                    buf += \"|\"; i += 2\n               \
          \ elif s[i] == \"|\":\n                    cells.append(buf.strip()); buf = \"\"; i += 1\n                else:\n\
          \                    buf += s[i]; i += 1\n            cells.append(buf.strip())\n            return cells\n    \
          \    header = [h.strip().lstrip(\"\\ufeff\") for h in split_md(lines[0])]\n        rows = []\n        for ln in\
          \ lines[1:]:\n            cells = split_md(ln)\n            if cells and all(re.fullmatch(r\":?-+:?\", c.strip())\
          \ for c in cells if c.strip()):\n                continue\n            if len(cells) < len(header):\n          \
          \      cells += [\"\"] * (len(header) - len(cells))\n            rows.append({header[i]: cells[i] if i < len(cells)\
          \ else \"\" for i in range(len(header))})\n        return header, rows\n    reader = csv.DictReader(io.StringIO(text))\n\
          \    header = [h.strip().lstrip(\"\\ufeff\") for h in (reader.fieldnames or [])]\n    rows = []\n    for r in reader:\n\
          \        d = {}\n        for k, v in r.items():\n            if k is None:\n                continue\n         \
          \   d[k.strip().lstrip(\"\\ufeff\")] = v.strip() if isinstance(v, str) else v\n        rows.append(d)\n    return\
          \ header, rows\n\ndef _parse_table(name, text, required, float_cols, int_cols):\n    header, raw_rows = _split_table(text)\n\
          \    issues, rows = [], []\n    missing = [c for c in required if c not in header]\n    if missing:\n        return\
          \ rows, [f\"{name} 缺少必要列 {missing}\"]\n    for idx, r in enumerate(raw_rows, start=2):\n        out = {}\n     \
          \   for c in required:\n            v = str(r.get(c, \"\")).strip()\n            if v == \"\":\n               \
          \ issues.append({\"table\": name, \"row\": idx, \"col\": c, \"issue\": \"必填字段为空\"})\n                v = \"0\" if\
          \ c in float_cols or c in int_cols else \"\"\n            try:\n                if c in float_cols:\n          \
          \          out[c] = float(v)\n                elif c in int_cols:\n                    out[c] = int(float(v))\n\
          \                else:\n                    out[c] = v\n            except Exception:\n                issues.append({\"\
          table\": name, \"row\": idx, \"col\": c, \"issue\": f\"类型无法解析：{v}\"})\n                out[c] = 0.0 if c in float_cols\
          \ else (0 if c in int_cols else v)\n        rows.append(out)\n    return rows, issues\n\ndef main(slot_text, cell_text,\
          \ demand_text, coverage_text, transfer_text, power_text, restriction_text, rule_text):\n    specs = OrderedDict([\n\
          \        (\"slots\", (slot_text, [\"case_id\",\"slot_id\",\"start_time\",\"end_time\",\"duration_hours\"], {\"duration_hours\"\
          }, set())),\n        (\"cells\", (cell_text, [\"cell_id\",\"cell_name\",\"site_id\",\"scene\",\"coverage_group\"\
          ,\"role\",\"model_id\",\"x\",\"y\",\"initial_state\",\"initial_deep_slots\"], {\"x\",\"y\"}, {\"initial_deep_slots\"\
          })),\n        (\"demands\", (demand_text, [\"slot_id\",\"cell_id\",\"demand_units\"], {\"demand_units\"}, set())),\n\
          \        (\"coverage\", (coverage_text, [\"group_id\",\"anchor_cell_id\",\"min_active_cells\"], set(), {\"min_active_cells\"\
          })),\n        (\"transfer\", (transfer_text, [\"source_cell_id\",\"target_cell_id\",\"priority\",\"max_transfer_units\"\
          ], {\"max_transfer_units\"}, {\"priority\"})),\n        (\"power\", (power_text, [\"model_id\",\"state\",\"capacity_units\"\
          ,\"base_power_w\",\"slope_w_per_unit\"], {\"capacity_units\",\"base_power_w\",\"slope_w_per_unit\"}, set())),\n\
          \        (\"restrictions\", (restriction_text, [\"restriction_id\",\"cell_id\",\"restriction_type\",\"start_time\"\
