          ], set(), set())),\n    ])\n    tables, batch, row_issues = OrderedDict(), [], []\n    for name, (text, required,\
          \ float_cols, int_cols) in specs.items():\n        rows, issues = _parse_table(name, text, required, float_cols,\
          \ int_cols)\n        tables[name] = rows\n        if any(\"缺少必要列\" in x for x in issues):\n            batch.extend(issues)\n\
          \        else:\n            row_issues.extend(issues)\n\n    key_funcs = {\n        \"slots\": lambda r: r.get(\"\
          slot_id\", \"\"),\n        \"cells\": lambda r: r.get(\"cell_id\", \"\"),\n        \"demands\": lambda r: (r.get(\"\
          slot_id\", \"\"), r.get(\"cell_id\", \"\")),\n        \"coverage\": lambda r: r.get(\"group_id\", \"\"),\n     \
          \   \"transfer\": lambda r: (r.get(\"source_cell_id\", \"\"), r.get(\"target_cell_id\", \"\")),\n        \"power\"\
          : lambda r: (r.get(\"model_id\", \"\"), r.get(\"state\", \"\")),\n        \"restrictions\": lambda r: r.get(\"restriction_id\"\
          , \"\"),\n        \"rules\": lambda r: r.get(\"rule_key\", \"\"),\n    }\n    for name, rows in tables.items():\n\
          \        seen = set()\n        for i, r in enumerate(rows, start=2):\n            k = key_funcs[name](r)\n     \
          \       if k in seen:\n                row_issues.append({\"table\": name, \"row\": i, \"issue\": f\"主键重复：{k}\"\
          })\n            seen.add(k)\n\n    slots = {r[\"slot_id\"] for r in tables[\"slots\"]}\n    cells = {r[\"cell_id\"\
          ]: r for r in tables[\"cells\"]}\n    models = {r[\"model_id\"] for r in tables[\"power\"]}\n    power_keys = {(r[\"\
          model_id\"], r[\"state\"]) for r in tables[\"power\"]}\n    groups = {r[\"group_id\"] for r in tables[\"coverage\"\
          ]}\n\n    for r in tables[\"demands\"]:\n        if r[\"slot_id\"] not in slots:\n            row_issues.append({\"\
          table\":\"demands\",\"issue\":f\"未知 slot_id {r['slot_id']}\"})\n        if r[\"cell_id\"] not in cells:\n      \
          \      row_issues.append({\"table\":\"demands\",\"issue\":f\"未知 cell_id {r['cell_id']}\"})\n    for cid, c in cells.items():\n\
          \        if c[\"model_id\"] not in models:\n            row_issues.append({\"table\":\"cells\",\"cell_id\":cid,\"\
          issue\":f\"未知 model_id {c['model_id']}\"})\n        if (c[\"model_id\"], c[\"initial_state\"]) not in power_keys:\n\
          \            row_issues.append({\"table\":\"cells\",\"cell_id\":cid,\"issue\":\"initial_state 与 model_id 无对应功耗参数\"\
          })\n        if c[\"coverage_group\"] not in groups:\n            row_issues.append({\"table\":\"cells\",\"cell_id\"\
          :cid,\"issue\":f\"coverage_group {c['coverage_group']} 无覆盖约束\"})\n    for r in tables[\"coverage\"]:\n        if\
          \ r[\"anchor_cell_id\"] not in cells:\n            row_issues.append({\"table\":\"coverage\",\"group_id\":r[\"group_id\"\
          ],\"issue\":\"anchor_cell_id 不存在\"})\n    for r in tables[\"transfer\"]:\n        if r[\"source_cell_id\"] not in\
          \ cells:\n            row_issues.append({\"table\":\"transfer\",\"issue\":f\"source_cell_id 不存在 {r['source_cell_id']}\"\
          })\n        if r[\"target_cell_id\"] not in cells:\n            row_issues.append({\"table\":\"transfer\",\"issue\"\
          :f\"target_cell_id 不存在 {r['target_cell_id']}\"})\n    for r in tables[\"restrictions\"]:\n        if r[\"cell_id\"\
          ] not in cells:\n            row_issues.append({\"table\":\"restrictions\",\"issue\":f\"cell_id 不存在 {r['cell_id']}\"\
          })\n\n    rules = {r[\"rule_key\"]: r[\"value\"] for r in tables[\"rules\"]}\n    summary = {\n        \"slot_count\"\
          : len(tables[\"slots\"]),\n        \"cell_count\": len(tables[\"cells\"]),\n        \"demand_rows\": len(tables[\"\
          demands\"]),\n        \"coverage_rows\": len(tables[\"coverage\"]),\n        \"transfer_rows\": len(tables[\"transfer\"\
          ]),\n        \"power_rows\": len(tables[\"power\"]),\n        \"restriction_rows\": len(tables[\"restrictions\"\
          ]),\n        \"rule_rows\": len(tables[\"rules\"]),\n    }\n    parse_ok = \"true\" if len(batch) == 0 and len(row_issues)\
          \ == 0 else \"false\"\n    return {\n        \"parse_ok\": parse_ok,\n        \"batch_issues_json\": json.dumps(batch,\
          \ ensure_ascii=False),\n        \"row_issues_json\": json.dumps(row_issues, ensure_ascii=False),\n        \"tables_json\"\
          : json.dumps(tables, ensure_ascii=False),\n        \"rules_json\": json.dumps(rules, ensure_ascii=False),\n    \
          \    \"summary_json\": json.dumps(summary, ensure_ascii=False),\n    }\n"
